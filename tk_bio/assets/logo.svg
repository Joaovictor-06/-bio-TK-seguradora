<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Circular mint/cyan background -->
  <circle cx="50" cy="50" r="48" fill="#bfe5e7" stroke="#10b981" stroke-width="2.5" />
  
  <!-- Blue squircle badge -->
  <path d="M 33 24 
           C 27 24 24 27 24 33 
           L 24 67 
           C 24 73 27 76 33 76 
           L 67 76 
           C 73 76 76 73 76 67 
           L 76 33 
           C 76 27 73 24 67 24 
           Z" 
        fill="#0d4ca3" rx="12" />
  
  <!-- More precise rounded badge with customized curve matching TK logo -->
  <rect x="25" y="25" width="50" height="50" rx="14" fill="#0d4ca3" />
  
  <!-- Vertical cyan capsule stem (left side of T/K) -->
  <rect x="34.5" y="34" width="9" height="32" rx="4.5" fill="#7ed5df" />
  
  <!-- K white strokes -->
  <g fill="#ffffff">
    <!-- Top-right arm: rounded capsule angled ~45deg -->
    <path d="M 42 53 L 58 37 C 60 35 63 35 65 37 C 67 39 67 42 65 44 L 50.5 58.5 Z" />
    <!-- Bottom-right leg: rounded capsule angled ~45deg -->
    <path d="M 43 47 L 58.5 63 C 60.5 65 60.5 68 58.5 70 C 56.5 72 53.5 72 51.5 70 L 37 55 Z" />
  </g>
</svg>
